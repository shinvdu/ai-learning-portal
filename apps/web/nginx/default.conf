# Nginx for the AI Learning Portal web image (HTTP-only; terminate TLS upstream).
#
# The container serves the Vite build of apps/web and reverse-proxies /api to
# the `api` compose service. TLS/HSTS belong to the TLS-terminating edge (see
# deploy/env.example and deploy/nginx.conf.example); leave this listener on :80.

upstream portal_api {
    server api:8787;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Raw media uploads go through POST /api/v1/admin/media/upload, capped at
    # MEDIA_MAX_BYTES (50MB by default). Keep 64m of headroom here; the API
    # still enforces its own 2MB JSON limit and MEDIA_MAX_BYTES on raw bodies.
    client_max_body_size 64m;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Security headers. nginx does not inherit add_header into a location that
    # defines its own add_header, so /assets repeats the non-CSP ones below.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # HSTS must be emitted by the TLS edge only:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # API reverse proxy. The API mounts /api/v1 and the legacy /api alias.
    location /api/ {
        proxy_pass http://portal_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # Health endpoints are internal-only (Docker/private networks + loopback).
    # The public web port should not expose them.
    location = /healthz {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        access_log off;
        proxy_pass http://portal_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /readyz {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        access_log off;
        proxy_pass http://portal_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed Vite bundles and media: immutable for a year.
    location /assets/ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # The HTML shell must never be cached, so deploys pick up new bundles.
    # `expires -1` emits `Cache-Control: no-cache`; the security headers are
    # repeated because defining add_header here disables server-level ones.
    location = /index.html {
        expires -1;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # History-mode SPA: unknown extensionless paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}