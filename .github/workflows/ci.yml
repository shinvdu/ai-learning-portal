name: CI

on:
  push:
    branches: [next, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  test:
    name: Unit + API integration
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: portal
          POSTGRES_PASSWORD: portal
          POSTGRES_DB: ai_portal
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U portal -d ai_portal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      APP_ENV: test
      NODE_ENV: test
      DATABASE_URL: postgres://portal:portal@127.0.0.1:5433/ai_portal
      REDIS_URL: redis://127.0.0.1:6380/15
      MFA_ENC_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      ADMIN_EMAIL: admin@ci.test
      ADMIN_PASSWORD: ci-admin-password
      PUBLIC_BASE_URL: http://127.0.0.1:8787
      MAIL_TRANSPORT: console

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `npm test` creates `ai_portal_test`, applies migrations, seeds the
      # golden fixture and runs the API integration suite against it.
      - name: Run tests
        run: npm test

  e2e:
    name: Playwright smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: portal
          POSTGRES_PASSWORD: portal
          POSTGRES_DB: ai_portal
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U portal -d ai_portal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      APP_ENV: test
      NODE_ENV: test
      DATABASE_URL: postgres://portal:portal@127.0.0.1:5433/ai_portal
      REDIS_URL: redis://127.0.0.1:6380/15
      MFA_ENC_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      ADMIN_EMAIL: admin@ci.test
      ADMIN_PASSWORD: ci-admin-password
      PUBLIC_BASE_URL: http://127.0.0.1:8787
      MAIL_TRANSPORT: console
      # Keep Playwright deterministic in CI.
      CI: 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # The Playwright `webServer` block starts the built API and Vite, but the
      # database must be migrated and seeded first.
      - name: Migrate and seed ai_portal
        run: |
          npm run db:migrate
          npm run seed -w @portal/api -- --demo-records

      - name: Run Playwright smoke suite
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7